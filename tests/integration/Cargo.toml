[package]
name = "integration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace-level integration tests for the zuit CLI binary."
# This is a test-only member: it has no library or binary targets.  The single
# [[test]] target is compiled and run by `cargo test -p integration`.
publish = false

[dev-dependencies]
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "plugins"
path = "tests/plugins.rs"

[lints]
workspace = true
