<!-- zuit mark: solid stencil Z. Three connected forms (top bar, diagonal stripe,
     bottom bar), sharp 90° corners, single fill. Light-mode variant: navy
     #1a4480 (--cl-accent-primary, AA-verified). For the dark-mode pair see
     logo-dark.svg; for theme-adaptive surfaces see favicon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="zuit">
  <title>zuit</title>
  <g fill="#1a4480">
    <rect x="10" y="10" width="44" height="10"/>
    <polygon points="42,20 54,20 22,44 10,44"/>
    <rect x="10" y="44" width="44" height="10"/>
  </g>
</svg>
