<!-- zuit favicon: solid stencil Z with embedded prefers-color-scheme switch.
     Browsers honour @media rules inside SVGs loaded via <link rel="icon">, so
     this single file adapts to the user's OS / browser theme without any
     accompanying CSS. Light: navy #1a4480. Dark: cool near-white #eef4ff. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="zuit">
  <title>zuit</title>
  <style>
    .z-mark { fill: #1a4480; }
    @media (prefers-color-scheme: dark) {
      .z-mark { fill: #eef4ff; }
    }
  </style>
  <g class="z-mark">
    <rect x="10" y="10" width="44" height="10"/>
    <polygon points="42,20 54,20 22,44 10,44"/>
    <rect x="10" y="44" width="44" height="10"/>
  </g>
</svg>
