[package]
name = "zuit-node"
version = "0.1.0"
edition = "2021"
description = "Node.js bindings for the zuit static analysis engine."
license = "MIT"

# This crate is intentionally excluded from the workspace to avoid the
# workspace-level `unsafe_code = "forbid"` lint conflicting with napi-rs.
# It pulls zuit-core via a path dependency.
[workspace]
members = []

[lib]
name = "zuit_node"
crate-type = ["cdylib"]

[dependencies]
zuit-core = { path = "../../crates/zuit-core" }
napi = { version = "2", features = ["napi9"] }
napi-derive = "2"
serde_json = "1"

# Required by zuit-core's transitive deps
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
smallvec = { version = "1", features = ["serde"] }
ignore = "0.4"
toml = "1"

[build-dependencies]
napi-build = "2"

[lints.rust]
# Allow unsafe_code here because napi-rs requires it internally.
# The binding itself contains no unsafe Rust; napi macros generate it.
