name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # -------------------------------------------------------------------------
  # verify: SSOT sync check + tag version check
  # -------------------------------------------------------------------------
  verify:
    name: verify SSOT + tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sync-check (managed files match meta/project.toml)
        run: cargo xtask sync-check
      - name: verify-tag (git tag matches SSOT version)
        run: cargo xtask verify-tag "${{ github.ref_name }}"

  # -------------------------------------------------------------------------
  # build-rust: compile the workspace on all three platforms
  # -------------------------------------------------------------------------
  build-rust:
    name: build-rust (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build workspace
        run: cargo build --workspace --release

  # -------------------------------------------------------------------------
  # build-wheels: maturin builds for Python
  # -------------------------------------------------------------------------
  build-wheels:
    name: build-wheels (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          args: --release --out dist
          # `manylinux: auto` is only consulted on Linux runners and yields
          # PyPI-compatible manylinux2014/2_28 wheels. It is a no-op on
          # macOS/Windows runners, so a single value works for the matrix.
          manylinux: auto
      - name: upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: bindings/python/dist/

  # -------------------------------------------------------------------------
  # build-sdist: maturin source distribution
  # -------------------------------------------------------------------------
  build-sdist:
    name: build-sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - name: upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: bindings/python/dist/

  # -------------------------------------------------------------------------
  # publish-to-pypi: OIDC trusted publishing (no API token required)
  # -------------------------------------------------------------------------
  publish-to-pypi:
    name: publish-to-pypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: publish to PyPI via trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # -------------------------------------------------------------------------
  # build-npm: napi-rs build for Node.js
  # -------------------------------------------------------------------------
  build-npm:
    name: build-npm (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install napi-rs CLI
        working-directory: bindings/node
        run: npm install
      - name: build napi package
        working-directory: bindings/node
        run: npm run build
      - name: upload npm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.os }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts
            bindings/node/package.json
      # TODO: publish to npm
      # - run: npm publish --access public
