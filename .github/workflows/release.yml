name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # -------------------------------------------------------------------------
  # verify: SSOT sync check + tag version check
  # -------------------------------------------------------------------------
  verify:
    name: verify SSOT + tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sync-check (managed files match meta/project.toml)
        run: cargo xtask sync-check
      - name: verify-tag (git tag matches SSOT version)
        run: cargo xtask verify-tag "${{ github.ref_name }}"

  # -------------------------------------------------------------------------
  # build-rust: compile the workspace on all three platforms
  # -------------------------------------------------------------------------
  build-rust:
    name: build-rust (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build workspace
        run: cargo build --workspace --release

  # -------------------------------------------------------------------------
  # build-wheels: maturin builds for Python
  # -------------------------------------------------------------------------
  build-wheels:
    name: build-wheels (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pin the build-host Python: GitHub runners track the latest CPython
      # release (currently 3.14 on macos-latest), but pyo3 0.22 supports up
      # to Python 3.13 only. Without this pin the macOS wheel build aborts
      # in pyo3-ffi's build script. 3.12 is widely available across runners.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build the native CLI binary in this job so it can be staged into the
      # python-source tree before maturin runs. This avoids cross-job artifact
      # wiring: the binary is compiled and bundled in a single job per OS.
      - name: build CLI binary
        run: cargo build --release -p zuit
      # Stage the compiled binary next to _cli.py so maturin bundles it.
      # pyproject.toml [tool.maturin] include lists both zuit and zuit.exe;
      # only the file that actually exists on each OS will be present.
      - name: stage CLI binary for maturin (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/release/zuit bindings/python/python/zuit/zuit
          chmod +x bindings/python/python/zuit/zuit
      - name: stage CLI binary for maturin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target\release\zuit.exe bindings\python\python\zuit\zuit.exe
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          args: --release --out dist
          # `manylinux: auto` is only consulted on Linux runners and yields
          # PyPI-compatible manylinux2014/2_28 wheels. It is a no-op on
          # macOS/Windows runners, so a single value works for the matrix.
          manylinux: auto
      - name: upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: bindings/python/dist/

  # -------------------------------------------------------------------------
  # build-sdist: maturin source distribution
  # -------------------------------------------------------------------------
  build-sdist:
    name: build-sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - name: upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: bindings/python/dist/

  # -------------------------------------------------------------------------
  # publish-to-pypi: OIDC trusted publishing (no API token required)
  # -------------------------------------------------------------------------
  publish-to-pypi:
    name: publish-to-pypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: publish to PyPI via trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # -------------------------------------------------------------------------
  # build-npm: launcher-only sanity check for Node.js
  # -------------------------------------------------------------------------
  build-npm:
    name: build-npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install dependencies
        working-directory: bindings/node
        run: npm install
      - name: run tests
        working-directory: bindings/node
        run: npm test
      - name: upload npm dist
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: bindings/node

  # -------------------------------------------------------------------------
  # publish-to-npm: OIDC trusted publishing (no API token required)
  # -------------------------------------------------------------------------
  publish-to-npm:
    name: publish-to-npm
    needs: build-npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: download npm dist
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: bindings/node
      - name: publish to npm via trusted publisher
        working-directory: bindings/node
        run: npm publish --provenance --access public
