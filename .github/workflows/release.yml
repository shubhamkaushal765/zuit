name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # -------------------------------------------------------------------------
  # verify: SSOT sync check + tag version check
  # -------------------------------------------------------------------------
  verify:
    name: verify SSOT + tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sync-check (managed files match meta/project.toml)
        run: cargo xtask sync-check
      - name: verify-tag (git tag matches SSOT version)
        run: cargo xtask verify-tag "${{ github.ref_name }}"

  # -------------------------------------------------------------------------
  # build-rust: compile the workspace on all three platforms
  # -------------------------------------------------------------------------
  build-rust:
    name: build-rust (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build workspace
        run: cargo build --workspace --release

  # -------------------------------------------------------------------------
  # build-wheels: maturin builds for Python
  # -------------------------------------------------------------------------
  build-wheels:
    name: build-wheels (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          args: --release --out dist
      - name: upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/python/dist/
      # TODO: publish to PyPI
      # - run: twine upload dist/*

  # -------------------------------------------------------------------------
  # build-npm: napi-rs build for Node.js
  # -------------------------------------------------------------------------
  build-npm:
    name: build-npm (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install napi-rs CLI
        working-directory: bindings/node
        run: npm install
      - name: build napi package
        working-directory: bindings/node
        run: npm run build
      - name: upload npm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.os }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts
            bindings/node/package.json
      # TODO: publish to npm
      # - run: npm publish --access public
